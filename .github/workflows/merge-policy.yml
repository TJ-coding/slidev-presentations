#!/usr/bin/env bash
# Merge-gate CI: label-based backstop for the branch policy.
#
#   PRs to main    : must NOT be labelled ai-approved (human gate only)
#   PRs to ai-main : must be labelled ai-approved (AI review recorded)
#
# This complements server-side rulesets (see MERGE-POLICY.md); it does not
# replace required reviewers.
name: merge-policy

on:
  pull_request:
    branches: [main, ai-main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check gate labels
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          LABELS="$(gh pr view "${{ github.event.pull_request.number }}" --json labels -q '.labels[].name')"
          echo "labels: $LABELS"
          if [ "$BASE" = "main" ] && echo "$LABELS" | grep -qx "ai-approved"; then
            echo "::error::PR to main may not use the ai-approved label — main requires human review."
            exit 1
          fi
          if [ "$BASE" = "ai-main" ] && ! echo "$LABELS" | grep -qx "ai-approved"; then
            echo "::error::PR to ai-main needs the ai-approved label (add it after the AI review)."
            exit 1
          fi
          echo "gate OK for base $BASE"
