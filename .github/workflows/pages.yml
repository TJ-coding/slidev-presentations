# Docs site: Jekyll (just-the-docs) from docs/, plus the live-demo deck built
# from the docs' own examples (docs/_demo/build_demo.py) into docs/demo/.
name: docs

on:
  push:
    branches: [ai-main]
    paths:
      - 'docs/**'
      - 'skills/slidev-presentation/template/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the live-demo deck
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          rsync -a --exclude node_modules --exclude dist skills/slidev-presentation/template/ "$RUNNER_TEMP/demo/"
          python3 docs/_demo/build_demo.py docs "$RUNNER_TEMP/demo"
          cd "$RUNNER_TEMP/demo"
          npm install --no-audit --no-fund
          npx slidev build demo.md --base /slidev-presentations/demo/ --out "$GITHUB_WORKSPACE/docs/demo"
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
