tem, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#0B0C0C">e(y₃)</text><text x="520" y="104" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#505A5F">embeddings (one per item)</text><text x="520" y="439" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#505A5F">embeddings (one per item)</text></g><g><path d="M688,143 C712,143 712,244 736,244" fill="none" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"></path><path d="M688,588 C718,588 718,504 748,504" fill="none" stroke="#8C8C8C" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"></path><text x="760" y="210" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="14" fill="#505A5F">all n × m pairs, no encoder in the loop</text></g><g><text x="772" y="232" text-anchor="middle" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#DE8F05">y₁</text><text x="836" y="232" text-anchor="middle" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#DE8F05">y₂</text><text x="900" y="232" text-anchor="middle" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#DE8F05">y₃</text><text x="728" y="282" text-anchor="end" dominant-baseline="central" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0173B2">ŷ₁</text><text x="728" y="346" text-anchor="end" dominant-baseline="central" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0173B2">ŷ₂</text><text x="728" y="410" text-anchor="end" dominan