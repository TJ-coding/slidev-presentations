ŷ₃</text><text x="115" y="323" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#0B0C0C">ŷ₄</text><text x="115" y="478" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#0B0C0C">y₁</text><text x="115" y="533" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#0B0C0C">y₂</text><text x="115" y="588" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#0B0C0C">y₃</text><text x="40" y="104" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0173B2">hypotheses ŷᵢ</text><text x="40" y="439" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#DE8F05">pseudo-references yⱼ</text></g><g><rect x="250" y="340" width="180" height="130" rx="10" fill="#F3F6F8" stroke="#505A5F" stroke-width="2"></rect><text x="340" y="392" text-anchor="middle" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#0B0C0C">shared bi-encoder</text><text x="340" y="420" text-anchor="middle" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="14" fill="#505A5F">e(·) — same weights</text><text x="340" y="442" text-anchor="middle" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="14" fill="#505A5F">one pass per item</text></g><g><rect x="520" y="120" width="150" height="46" rx="7" fill="rgba(1,115,178,0.14)" stroke="#0173B2" stroke-width="1.5"></rect><rect x="520" y="180" width="150