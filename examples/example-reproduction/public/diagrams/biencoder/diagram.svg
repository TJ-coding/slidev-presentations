<svg id="diagram" xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" data-title="Bi-encoder score matrix" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8C8C8C"></path></marker></defs><text x="40" y="40" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0B0C0C">Bi-encoder: two encodings per item — pairs scored by dot product</text><text x="40" y="68" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#505A5F">Every entry of u is uᵢⱼ = e(ŷᵢ) · e(yⱼ) — one scalar, no model calls inside the matrix.</text><g><path d="M190,143 C220,143 220,370 250,370" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M190,203 C220,203 220,392 250,392" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M190,263 C220,263 220,414 250,414" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M190,323 C220,323 220,436 250,436" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M190,478 C220,478 220,440 250,440" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M190,533 C220,533 220,418 250,418" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M190,588 C220,588 220,396 250,396" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M430,385 C475,385 475,143 520,143" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M430,385 C475,385 475,203 520,203" fill="none" stroke="#8C8C8C" stroke-width="1.5" marker-end="url(#arrow)"></path><path d="M430,385 C475,385 475,263 520,263" fill="none" stroke="#8C