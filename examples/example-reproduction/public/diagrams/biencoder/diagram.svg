ke="none"></rect><text x="62" y="654" font-family="-apple-system, &quot;Helvetica Neue&quot;, Helvetica, Arial, sans-serif" font-size="16" fill="#0B0C0C">Amortised encoding, trivial scoring: the expensive model runs once per item; every uᵢⱼ after that is free.</text></svg>
